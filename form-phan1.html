<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Thông tin cơ bản - Phần 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .hobby-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .hobby-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hobby-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button[type="submit"] {
            background: #667eea;
            color: white;
        }
        button[type="submit"]:hover {
            background: #5a6fd6;
        }
        button[type="reset"] {
            background: #f0f0f0;
            color: #333;
        }
        button[type="reset"]:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Thông tin cá nhân</h2>
        <form action="#" method="post">
            <div class="form-group">
                <label for="yourname">Họ và tên</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích</label>
                <div class="hobby-group">
                    <div class="hobby-item">
                        <input type="checkbox" id="hobby1" name="hobby" value="doc-sach">
                        <label for="hobby1">Đọc sách</label>
                    </div>
                    <div class="hobby-item">
                        <input type="checkbox" id="hobby2" name="hobby" value="nghe-nhac">
                        <label for="hobby2">Nghe nhạc</label>
                    </div>
                    <div class="hobby-item">
                        <input type="checkbox" id="hobby3" name="hobby" value="the-thao">
                        <label for="hobby3">Thể thao</label>
                    </div>
                    <div class="hobby-item">
                        <input type="checkbox" id="hobby4" name="hobby" value="du-lich">
                        <label for="hobby4">Du lịch</label>
                    </div>
                    <div class="hobby-item">
                        <input type="checkbox" id="hobby5" name="hobby" value="lap-trinh">
                        <label for="hobby5">Lập trình</label>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="submit">Gửi thông tin</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>
