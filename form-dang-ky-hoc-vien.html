<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng ký Học viên - Phần 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 30px 15px;
        }
        .form-container {
            background: white;
            max-width: 650px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 8px;
        }
        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .radio-item input,
        .checkbox-item input {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .radio-item label,
        .checkbox-item label {
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button[type="submit"] {
            background: #1e3c72;
            color: white;
        }
        button[type="submit"]:hover {
            background: #16305a;
        }
        button[type="reset"] {
            background: #e9ecef;
            color: #333;
        }
        button[type="reset"]:hover {
            background: #dee2e6;
        }
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        @media (max-width: 500px) {
            .form-container {
                padding: 25px 20px;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng ký Học viên</h2>
        <p class="subtitle">Vui lòng điền đầy đủ thông tin bên dưới</p>

        <form action="#" method="post">
            <!-- Họ và tên -->
            <div class="form-group">
                <label for="fullname" class="required">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="required">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label for="phone" class="required">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="0912345678" required>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <!-- Giới tính -->
            <div class="form-group">
                <label class="required">Giới tính</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="gender-male" name="gender" value="nam" required>
                        <label for="gender-male">Nam</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="gender-female" name="gender" value="nu">
                        <label for="gender-female">Nữ</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="gender-other" name="gender" value="khac">
                        <label for="gender-other">Khác</label>
                    </div>
                </div>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <textarea id="address" name="address" placeholder="Nhập địa chỉ của bạn..."></textarea>
            </div>

            <!-- Khóa học -->
            <div class="form-group">
                <label for="course" class="required">Khóa học</label>
                <select id="course" name="course" required>
                    <option value="">-- Chọn khóa học --</option>
                    <option value="html-css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <!-- Hình thức học -->
            <div class="form-group">
                <label class="required">Hình thức học</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="study-online" name="study_type" value="online" required>
                        <label for="study-online">Online</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="study-offline" name="study_type" value="offline">
                        <label for="study-offline">Offline</label>
                    </div>
                </div>
            </div>

            <!-- Sở thích -->
            <div class="form-group">
                <label>Sở thích</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby1" name="hobby" value="doc-sach">
                        <label for="hobby1">Đọc sách</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby2" name="hobby" value="nghe-nhac">
                        <label for="hobby2">Nghe nhạc</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby3" name="hobby" value="the-thao">
                        <label for="hobby3">Thể thao</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby4" name="hobby" value="du-lich">
                        <label for="hobby4">Du lịch</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby5" name="hobby" value="lap-trinh">
                        <label for="hobby5">Lập trình</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="hobby6" name="hobby" value="game">
                        <label for="hobby6">Chơi game</label>
                    </div>
                </div>
            </div>

            <!-- Ghi chú -->
            <div class="form-group">
                <label for="note">Ghi chú</label>
                <textarea id="note" name="note" placeholder="Ghi chú thêm (nếu có)..."></textarea>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>
